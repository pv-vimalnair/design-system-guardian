name: design_system_guardian_flutter
description: Strict Flutter analyzer adapter for Design System Guardian.
version: 0.3.8
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  analysis_server_plugin: 0.3.15
  analyzer: 13.0.0
  analyzer_plugin: 0.14.9
  crypto: 3.0.7
  flutter:
    sdk: flutter

dev_dependencies:
  analyzer_testing: 0.2.6
  test: 1.31.2
  test_reflective_loader: 0.4.0

flutter:
  assets:
    - assets/sentinels/diagonal-stripes.svg
    - assets/sentinels/manifest.json
