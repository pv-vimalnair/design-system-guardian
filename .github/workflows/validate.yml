name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardian:
    name: Guardian / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out Guardian
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: plugins/design-system-guardian/requirements-test.txt

      - name: Verify committed public bytes and history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_public_release.py --repository-root . --history --ci

      - name: Install test dependencies
        run: python -m pip install -r plugins/design-system-guardian/requirements-test.txt

      - name: Fetch the pinned Codex validators
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/openai/codex.git "$RUNNER_TEMP/codex"
          git -C "$RUNNER_TEMP/codex" checkout 39a2438d16514d0d6f88105d17b0f747994af487

      - name: Validate plugin and skills
        shell: bash
        run: |
          python "$RUNNER_TEMP/codex/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py" plugins/design-system-guardian
          python "$RUNNER_TEMP/codex/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py" plugins/design-system-guardian/skills/build-with-design-system
          python "$RUNNER_TEMP/codex/codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py" plugins/design-system-guardian/skills/audit-design-system

      - name: Run core tests
        working-directory: plugins/design-system-guardian
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run Flutter adapter tests
        working-directory: plugins/design-system-guardian
        run: python -m unittest discover -s adapters/flutter/tests -p "test_*.py"

      - name: Verify schema inventory and parsing
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path("plugins/design-system-guardian")
          schemas = sorted(root.rglob("*.schema.json"))
          assert len(schemas) == 23, [str(path) for path in schemas]
          for path in schemas:
              json.loads(path.read_text(encoding="utf-8"))

      - name: Reject whitespace errors in changed range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          sha_pattern="^[0-9a-f]{40}$"

          require_sha() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ $sha_pattern ]]; then
              printf 'Missing or malformed %s\n' "$label" >&2
              exit 1
            fi
          }

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$PUSH_HEAD_SHA"
              ;;
            *)
              printf 'Unsupported event: %s\n' "$EVENT_NAME" >&2
              exit 1
              ;;
          esac

          require_sha "head" "$head"
          git cat-file -e "${head}^{commit}"
          if [[ "$base" == "$zero_sha" ]]; then
            base="$(git hash-object -t tree /dev/null)"
          else
            require_sha "base" "$base"
            git cat-file -e "${base}^{commit}"
          fi
          git diff --check "$base" "$head"
